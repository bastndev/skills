[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

# Shared by every crate: each one writes `version.workspace = true`, so the version lives here only.
[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/{{GITHUB_REPO}}"

# Shared dependency versions: declared once here, used with `name.workspace = true`.
[workspace.dependencies]
{{CRATE_PREFIX}}-brand = { path = "crates/brand" }
{{CRATE_PREFIX}}-ui = { path = "crates/ui" }
eframe = "0.37"

# `cargo run`: our code lightly optimised, dependencies (egui) fully optimised so the UI is smooth.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

# The build that ships.
[profile.release]
opt-level = 3
lto = "thin"

# Code-quality rules shared by every crate (each crate opts in with `[lints] workspace = true`).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
wildcard_imports = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
